name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      # No Node.js setup step: the frontend toolchain is Bun, provisioned
      # by pixi from pixi.toml (setup-pixi's lockfile cache covers it).

      # Runs the same checks `pixi run ci` runs locally: native-Mojo tests,
      # frontend lint, frontend build. See pixi.toml.
      - name: Run checks
        run: pixi run ci
