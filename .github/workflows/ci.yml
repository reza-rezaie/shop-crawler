name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Runs the same checks `pixi run ci` runs locally: native-Mojo tests,
      # frontend lint, frontend build. See pixi.toml.
      - name: Run checks
        run: pixi run ci
